<!DOCTYPE html>

    <title>Error page</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="card">
        <p class="header">Spectrum Lost</p>
        <div class="code-container">
            <p class="code">404</p>
            <p class="code glitch">404</p>
        </div>
        <div class="description">
            <p>Reality Error</p>
            <p>The page you seek has glitched out of this timeline</p>
        </div>
        <nav class="links">
            <div class="home-btn btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-door" viewBox="0 0 16 16">
                    <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4z"/>
                </svg>
                <a href="#">Bounce Home</a>
            </div>
            <div class="search-btn btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg>
                <a href="#">Deep Search</a>
            </div>
        </nav>
    </div>
    <div class="card blastoise">
        <span class="inner-card-backface">
        <span class="image">
            <span class="unflip">Unflip</span>
        </span>
        </span>
        <span class="inner-card">
            <span class="flip">Flip</span>
            <span class="glare"></span>
        </span>
    </div>
    <script src="./index.js"></script>
</body>
</html>
